# Escenario de prueba: s10_goal_fuera_geocerca
# Geocerca cuadrada de 30 × 30 m; goal fuera.
# Gemelo en gtest: test/test_scenarios.cpp
#
# Correr:
#   ros2 launch usv_control a_star_planner_launch.py site:=tests/s10_goal_fuera_geocerca
#   ros2 topic pub --once usv/planning/goal geometry_msgs/msg/PoseStamped "{pose: {position: {x: 20.0, y: 0.0}}}"
#   ros2 topic echo usv/planning/path
# Esperado (bote arrancando en el origen): STOP: no se encontró camino (el goal es letal por estar fuera).

localization_node:
  ros__parameters:
    use_fixed_datum: false
    origin_samples: 1

a_star_planner_node:
  ros__parameters:
    require_valid_position: false
    x_min: -50.0
    x_max: 50.0
    y_min: -50.0
    y_max: 50.0
    geofence: [-15.00, -15.00,
               15.00, -15.00,
               15.00, 15.00,
               -15.00, 15.00]
