# Escenario de prueba: s04_puerta_2m
# Puerta de 2 m entre centros (1.7 m libres), como en sim.yaml.
# Gemelo en gtest: test/test_scenarios.cpp
#
# Correr:
#   ros2 launch usv_control a_star_planner_launch.py site:=tests/s04_puerta_2m
#   ros2 topic pub --once usv/planning/goal geometry_msgs/msg/PoseStamped "{pose: {position: {x: 20.0, y: 0.0}}}"
#   ros2 topic echo usv/planning/path
# Esperado (bote arrancando en el origen): La cruza, pero con ~13 puntos separados 0.2 m cerca de la puerta (el centro cuesta más que cost_threshold).

localization_node:
  ros__parameters:
    use_fixed_datum: false
    origin_samples: 1

a_star_planner_node:
  ros__parameters:
    require_valid_position: false
    x_min: -50.0
    x_max: 50.0
    y_min: -50.0
    y_max: 50.0
    buoys: [10.00, -1.00, 0.15,
            10.00, 1.00, 0.15]
