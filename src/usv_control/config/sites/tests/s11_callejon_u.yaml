# Escenario de prueba: s11_callejon_u
# Callejón en U que encierra al bote, abierto hacia atrás (x < 0).
# Gemelo en gtest: test/test_scenarios.cpp
#
# Correr:
#   ros2 launch usv_control a_star_planner_launch.py site:=tests/s11_callejon_u
#   ros2 topic pub --once usv/planning/goal geometry_msgs/msg/PoseStamped "{pose: {position: {x: 16.0, y: 0.0}}}"
#   ros2 topic echo usv/planning/path
# Esperado (bote arrancando en el origen): El path sale por detrás (x < 0), rodea la U y llega.

localization_node:
  ros__parameters:
    use_fixed_datum: false
    origin_samples: 1

a_star_planner_node:
  ros__parameters:
    require_valid_position: false
    x_min: -50.0
    x_max: 50.0
    y_min: -50.0
    y_max: 50.0
    buoys: [8.00, -4.00, 0.15,
            8.00, -3.20, 0.15,
            8.00, -2.40, 0.15,
            8.00, -1.60, 0.15,
            8.00, -0.80, 0.15,
