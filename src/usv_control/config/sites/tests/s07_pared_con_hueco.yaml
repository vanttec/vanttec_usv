# Escenario de prueba: s07_pared_con_hueco
# Pared de boyas en x = 10 con un hueco entre y = 4 y y = 6.
# Gemelo en gtest: test/test_scenarios.cpp
#
# Correr:
#   ros2 launch usv_control a_star_planner_launch.py site:=tests/s07_pared_con_hueco
#   ros2 topic pub --once usv/planning/goal geometry_msgs/msg/PoseStamped "{pose: {position: {x: 20.0, y: 0.0}}}"
#   ros2 topic echo usv/planning/path
# Esperado (bote arrancando en el origen): Cruza x = 10 con y entre 4 y 6 (por el hueco).

localization_node:
  ros__parameters:
    use_fixed_datum: false
    origin_samples: 1

a_star_planner_node:
  ros__parameters:
    require_valid_position: false
    x_min: -50.0
    x_max: 50.0
    y_min: -50.0
    y_max: 50.0
    buoys: [10.00, -10.00, 0.15,
            10.00, -9.20, 0.15,
            10.00, -8.40, 0.15,
            10.00, -7.60, 0.15,
            10.00, -6.80, 0.15,
            10.00, -6.00, 0.15,
            10.00, -5.20, 0.15,
            10.00, -4.40, 0.15,
            10.00, -3.60, 0.15,
            10.00, -2.80, 0.15,
            10.00, -2.00, 0.15,
            10.00, -1.20, 0.15,
            10.00, -0.40, 0.15,
            10.00, 0.40, 0.15,
            10.00, 1.20, 0.15,
            10.00, 2.00, 0.15,
            10.00, 2.80, 0.15,
            10.00, 3.60, 0.15,
            10.00, 6.80, 0.15,
            10.00, 7.60, 0.15,
            10.00, 8.40, 0.15,
            10.00, 9.20, 0.15,
            10.00, 10.00, 0.15]
