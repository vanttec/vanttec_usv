# Escenario de prueba: s06_slalom
# Tres boyas alternadas a ±1 m.
# Gemelo en gtest: test/test_scenarios.cpp
#
# Correr:
#   ros2 launch usv_control a_star_planner_launch.py site:=tests/s06_slalom
#   ros2 topic pub --once usv/planning/goal geometry_msgs/msg/PoseStamped "{pose: {position: {x: 32.0, y: 0.0}}}"
#   ros2 topic echo usv/planning/path
# Esperado (bote arrancando en el origen): ~5 puntos zigzagueando entre las boyas.

localization_node:
  ros__parameters:
    use_fixed_datum: false
    origin_samples: 1

a_star_planner_node:
  ros__parameters:
    require_valid_position: false
    x_min: -50.0
    x_max: 50.0
    y_min: -50.0
    y_max: 50.0
    buoys: [8.00, 1.00, 0.15,
            16.00, -1.00, 0.15,
            24.00, 1.00, 0.15]
